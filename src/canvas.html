<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-prompt</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="/icon-small.svg">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Tints the app window's title bar to match the page (the OS still draws its shape and buttons). -->
<meta name="theme-color" content="#fff6df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161c" media="(prefers-color-scheme: dark)">
<style>
  /* Sketchbook neubrutalism: cream paper, hard ink outlines and offset shadows, marker-color accents. */
  :root {
    --bg: #fff6df;          /* sketchbook cover around the page */
    --paper: #ffffff;
    --ink: #141414;
    --muted: #5c5a52;
    --edge: #141414;        /* outlines */
    --drop: #141414;        /* offset shadows */
    --chrome: #fffdf6;
    --field: #ffffff;
    --hover: #fff1c2;
    --marker: #ffd23f;      /* highlighter yellow: primary actions, selection */
    --agent: #6c4cf5;       /* the agent's ink and voice */
    --agent-soft: #efeaff;
    --coral: #ff6b6b;       /* destructive */
    --mint: #3ddc97;        /* listening */
    --focus: #2f6fde;
    --dot: rgba(20,20,20,.13);
    --b: 2.5px;             /* outline width */
    --r: 10px;
    --font: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  /* Dark sketchbook: the page stays white so ink reads the same for you and the agent. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161c; --ink: #f4f1e8; --muted: #b3afa3; --edge: #f4f1e8; --drop: #000000;
      --chrome: #201f27; --field: #17161c; --hover: #2d2a1d; --agent-soft: #2a2442; --dot: rgba(244,241,232,.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink); font: 500 14px/1.45 var(--font); overflow: hidden;
    background: var(--bg); }
  body { display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; display: flex; }
  /* Canvas and toolbar on the left, the chat panel full height on the right, so their edges line up. */
  #left { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* The stage scrolls when zoomed in; overlays (layers, toast, zoom) sit on the fixed box around it. */
  #stageBox { position: relative; flex: 1; min-width: 0; min-height: 0; }
  #stage { position: absolute; inset: 0; overflow: auto; display: flex; }
  #wrap { margin: auto; padding: 16px; }
  #stage.panning, #stage.panning #paper { cursor: grabbing; }
  #stage.space #paper { cursor: grab; }
  #view { position: absolute; left: 14px; bottom: 14px; z-index: 2; display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; background: var(--chrome); border: var(--b) solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--drop);
    font-size: 12px; font-weight: 800; }
  #view label { display: flex; align-items: center; gap: 3px; color: var(--muted); }
  #view input::-webkit-inner-spin-button, #view input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #view input { -moz-appearance: textfield; width: 60px; height: 28px; font: inherit; font-weight: 700; color: var(--ink); background: var(--field);
    border: 2px solid var(--edge); border-radius: 6px; padding: 0 4px; text-align: right; }
  #view button { height: 28px; min-width: 28px; padding: 0 6px; }
  #zoomLabel { min-width: 52px !important; font-variant-numeric: tabular-nums; }
  .vsep { width: 2px; height: 18px; background: var(--edge); opacity: .25; margin: 0 2px; }

  /* ---------- the page */
  #wrap { position: relative; }
  #paper { display: block; background: var(--paper); border: var(--b) solid var(--edge); border-radius: 6px;
    box-shadow: 6px 6px 0 var(--drop); touch-action: none; cursor: crosshair; }
  #paper.eraser { cursor: cell; }
  #paper.text { cursor: text; }
  #paper.select { cursor: default; }
  #paper.fill { cursor: copy; }
  #paper.lasso { cursor: crosshair; }
  #selbar { position: absolute; z-index: 2; display: none; gap: 2px; padding: 3px; background: var(--chrome);
    border: 2px solid var(--edge); border-radius: 10px; box-shadow: 3px 3px 0 var(--drop); }
  #selbar.show { display: flex; }
  #selbar button { height: 30px; min-width: 30px; padding: 0 6px; border-width: 0; }
  #selbar #selDel:hover { background: var(--coral); }
  #paper.moving { cursor: move; }

  /* ---------- buttons */
  button { font: inherit; font-weight: 700; color: var(--ink); background: transparent; cursor: pointer;
    height: 38px; min-width: 38px; padding: 0 10px; border: var(--b) solid transparent; border-radius: var(--r);
    transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
  button:hover { background: var(--hover); }
  button[aria-pressed="true"] { background: var(--marker); color: #141414; border-color: var(--edge); box-shadow: 2px 2px 0 var(--drop); }
  /* Chunky buttons press down into their shadow. */
  .chunky { background: var(--chrome); border-color: var(--edge); box-shadow: 3px 3px 0 var(--drop); }
  .chunky:hover { background: var(--hover); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--drop); }
  .chunky:active, button[aria-pressed="true"]:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--drop); }
  button:disabled { opacity: .55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .lrow:focus-within { outline: 2px solid transparent; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .chunky:hover, .chunky:active { transform: none; } }
  @media (pointer: coarse) {
    button { height: 44px; min-width: 44px; }
    .swatch { width: 30px; height: 30px; min-width: 30px; }
    .lrow button { height: 40px; min-width: 40px; }
    .lrow .del { visibility: visible; }
  }
  .ic { width: 19px; height: 19px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; }
  .ic.sm { width: 15px; height: 15px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- toolbar: a strip of paper taped to the bottom */
  #bar { flex-shrink: 0; min-height: 74px; justify-content: center; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 12px 18px; background: var(--chrome); border-top: var(--b) solid var(--edge); }
  .group { display: flex; gap: 2px; align-items: center; }
  /* Compact toolbar so it stays on one row beside the chat panel; it still wraps on narrow windows. */
  #bar { gap: 8px 12px; padding: 12px 14px; }
  #bar button { height: 38px; min-width: 36px; padding: 0 8px; }
  #bar .group[aria-label="Colors"] { gap: 5px; }
  #bar .swatch { width: 22px; height: 22px; min-width: 22px; }
  #width { width: 80px; }
  .sep { width: var(--b); height: 26px; background: var(--edge); border-radius: 2px; opacity: .25; }
  .swatch { width: 24px; height: 24px; min-width: 24px; padding: 0; border-radius: 50%; border: 2px solid var(--edge); }
  .swatch:hover { transform: translateY(-2px); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--chrome), 0 0 0 5.5px var(--edge); }
  .swatch.custom { display: inline-block; position: relative; cursor: pointer; overflow: hidden;
    background: conic-gradient(#ff6b6b, #ffd23f, #3ddc97, #2f6fde, #6c4cf5, #ff6b6b); }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #widthGroup { gap: 8px; }
  #width { width: 96px; accent-color: var(--ink); }
  #widthDot { width: 24px; height: 24px; display: grid; place-items: center; }
  #widthDot i { display: block; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1.5px var(--chrome), 0 0 0 2.5px var(--edge); }

  /* ---------- chat panel */
  #side { position: relative; width: var(--side-w, 310px); flex-shrink: 0; display: flex; flex-direction: column; min-height: 0;
    background: var(--chrome); border-left: var(--b) solid var(--edge); }
  /* Drag the left edge to resize. */
  #sideGrip { position: absolute; left: -6px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 3; }
  #sideGrip:hover, #sideGrip.dragging, #sideGrip:focus-visible { background: linear-gradient(90deg, transparent 3px, var(--marker) 3px, var(--marker) 7px, transparent 7px); outline: none; }
  #sideToggle .ic { transition: transform .2s ease; }
  /* Collapsed: a slim rail that keeps the listening status and Send in reach. */
  #side.collapsed { width: 60px; }
  #side.collapsed #sideToggle .ic { transform: rotate(180deg); }
  #side.collapsed header { flex-direction: column; padding: 12px 0; gap: 10px; }
  #side.collapsed header > .ic, #side.collapsed header b, #side.collapsed #clearChat,
  #side.collapsed #chat, #side.collapsed #answers, #side.collapsed #note, #side.collapsed #sideGrip { display: none; }
  #side.collapsed #composer { margin-top: auto; justify-content: center; padding: 11px 0; }
  #side.collapsed #send { width: 40px; height: 40px; }
  #sideToggle.has-ask::after { content: ''; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--coral); border: 2px solid var(--edge); }
  #sideToggle { position: relative; }
  #side header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: var(--b) solid var(--edge); }
  #side header > .ic { color: #fff; background: var(--agent); border: 2px solid var(--edge); border-radius: 8px;
    width: 30px; height: 30px; padding: 4px; box-shadow: 2px 2px 0 var(--drop); }
  #side header b { flex: 1; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  #side header .hbtn, #status { width: 32px; height: 32px; min-width: 32px; padding: 0; display: grid; place-items: center;
    border: 2px solid var(--edge); border-radius: 8px; background: var(--chrome); box-shadow: 2px 2px 0 var(--drop); }
  #side header .hbtn:hover { background: var(--coral); }
  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { position: relative; max-width: 92%; padding: 9px 12px; border: 2px solid var(--edge); border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 3px 3px 0 var(--drop); }
  .msg.new { animation: pop .22s ease-out; }
  .msg.agent { align-self: flex-start; background: var(--agent-soft); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--marker); color: #141414; border-bottom-right-radius: 4px; }
  .msg.user.sketch-only { background: transparent; color: var(--muted); border: 0; box-shadow: none; font-size: 12px; padding: 0 2px; }
  .msg.user.has-img { padding: 6px; }
  .msg img { display: block; width: 100%; max-width: 220px; border: 2px solid var(--edge); border-radius: 8px; background: #fff;
    cursor: zoom-in; margin-bottom: 4px; }
  .msg .mdel { position: absolute; top: -10px; right: -10px; height: 24px; min-width: 24px; padding: 0; border-radius: 50%;
    background: var(--chrome); border: 2px solid var(--edge); color: var(--ink); display: none; }
  .msg .mdel:hover { background: var(--coral); }
  .msg:hover .mdel, .msg .mdel:focus-visible { display: inline-flex; align-items: center; justify-content: center; }
  @media (pointer: coarse) { .msg .mdel { display: inline-flex; align-items: center; justify-content: center; } }
  @keyframes pop { from { transform: translateY(6px) scale(.97); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .msg.new { animation: none; } }
  .chat-empty { color: var(--muted); font-size: 13px; margin: auto; text-align: center; max-width: 220px; }
  #answers { display: none; gap: 8px; padding: 0 14px 12px; }
  #answers.show { display: flex; }
  #answers .yes { background: var(--mint); color: #141414; }
  #composer { display: flex; gap: 10px; align-items: stretch; min-height: 74px; padding: 11px 14px; border-top: var(--b) solid var(--edge); }
  #note { flex: 1; min-width: 0; height: 52px; resize: none; font: inherit; color: var(--ink); background: var(--field);
    border: 2px solid var(--edge); border-radius: var(--r); padding: 9px 12px; }
  #note:focus { box-shadow: 3px 3px 0 var(--marker); outline: none; }
  #note:focus-visible { outline: none; }
  #send { width: 52px; height: auto; padding: 0; background: var(--marker); color: #141414; }
  #send .ic { width: 21px; height: 21px; }
  /* Listening: mint headphones. Busy: hourglass. The words are in the tooltip. */
  #status { color: var(--muted); }
  #status .ic { width: 17px; height: 17px; }
  #status.on { color: #141414; background: var(--mint); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(61,220,151,.28); } }
  @media (prefers-reduced-motion: reduce) { #status.on { animation: none; } }
  #status .on-icon, #status.on .off-icon { display: none; }
  #status.on .on-icon { display: inline; }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #side { width: auto; height: 230px; border-left: 0; border-top: var(--b) solid var(--edge); }
    #sideGrip { display: none; }
    #side.collapsed { width: auto; height: auto; }
    #side.collapsed header { flex-direction: row; padding: 8px 14px; }
  }

  /* ---------- layers: a sticky note on the page */
  #layers { position: absolute; top: 14px; right: 14px; width: 216px; max-height: calc(100% - 28px); overflow-y: auto;
    background: #fff8c9; color: #141414; border: var(--b) solid #141414; border-radius: 6px; box-shadow: 4px 4px 0 #141414;
    padding: 8px; display: none; z-index: 2; transform: rotate(.6deg); }
  #layers.open { display: block; }
  #layers button { color: #141414; }
  #layers button:hover { background: rgba(0,0,0,.07); }
  .lrow { display: flex; align-items: center; gap: 2px; border: 2px solid transparent; border-radius: 8px; padding: 0 2px; cursor: pointer; }
  .lrow:hover { background: rgba(0,0,0,.05); }
  .lrow.active { background: #fff; border-color: #141414; }
  .lrow.drop-above { box-shadow: inset 0 3px 0 var(--agent); }
  .lrow.drop-below { box-shadow: inset 0 -3px 0 var(--agent); }
  .lrow button { height: 28px; min-width: 28px; padding: 0 4px; border-width: 0; }
  .lrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 2px; font-weight: 700; }
  .lrow input { flex: 1; min-width: 0; font: inherit; border: 2px solid #141414; border-radius: 6px; padding: 2px 4px; }
  .lrow.hidden .name { color: #8a8678; text-decoration: line-through; }
  .lrow .agent { color: var(--agent); display: inline-flex; }
  .lrow .del, .lrow .ren { visibility: hidden; }
  .lrow:hover .del, .lrow.active .del, .lrow .del:focus-visible,
  .lrow:hover .ren, .lrow.active .ren, .lrow .ren:focus-visible { visibility: visible; }
  @media (pointer: coarse) { .lrow .ren { visibility: visible; } }
  #addLayer { width: 100%; display: flex; align-items: center; gap: 6px; justify-content: flex-start; height: 32px; margin-top: 4px;
    border: 2px dashed #141414; border-radius: 8px; color: #141414; }

  /* ---------- on-page text box, toast, hint */
  #textInput { position: absolute; display: none; font: 24px var(--font); line-height: 1.25; resize: none; overflow: hidden;
    white-space: pre; color: inherit; background: rgba(255,255,255,.92); border: 2px dashed var(--agent); border-radius: 4px;
    padding: 0 4px; outline: none; min-width: 120px; }
  #toast { position: absolute; bottom: 18px; left: 50%; transform: translate(-50%, 8px); background: var(--ink); color: var(--bg);
    font-weight: 700; padding: 8px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg); color: #5c5a52;
    font-size: 20px; font-weight: 800; pointer-events: none; display: none; align-items: center; gap: 8px; white-space: nowrap;
    background: linear-gradient(transparent 55%, rgba(255,210,63,.55) 55%); padding: 0 6px; }
  #hint.show { display: flex; }

  /* ---------- dialogs */
  #viewer { padding: 0; border: 0; background: transparent; max-width: 92vw; max-height: 92vh; }
  #viewer::backdrop, #confirmBox::backdrop { background: rgba(20,20,20,.45); }
  #viewer button { padding: 0; height: auto; background: transparent; border: 0; cursor: zoom-out; }
  #viewer img { display: block; max-width: 92vw; max-height: 92vh; border: var(--b) solid #141414; border-radius: 8px;
    background: #fff; box-shadow: 8px 8px 0 #141414; }
  #confirmBox { color: var(--ink); background: var(--chrome); border: var(--b) solid var(--edge); border-radius: 14px;
    box-shadow: 6px 6px 0 var(--drop); padding: 18px 20px; max-width: 360px; }
  #confirmBox h2 { margin: 0 0 6px; font-size: 16px; font-weight: 800; }
  #confirmBox p { margin: 0 0 16px; }
  #confirmBox form { display: flex; justify-content: flex-end; gap: 10px; }
  #confirmBox button[value="ok"] { background: var(--coral); color: #141414; }
  @media (max-width: 720px) { .sep { display: none; } }
</style>
</head>

<script>
const CLAUDE_COLOR = '#6c4cf5';  // the agent's ink, so its marks stand apart from yours
const paper = document.getElementById('paper');
const ctx = paper.getContext('2d');
const $ = (id) => document.getElementById(id);

let canvasSize = { width: 1200, height: 800 };
let state = { version: 0, items: [], say: null, waiting: false };
let scale = 1;
let tool = 'pen';
let color = '#1f2328';
let lineWidth = 3;
let drawing = null;          // stroke or shape in progress
const hiddenLayers = new Set();  // layer ids hidden on this screen
let activeLayer = null;          // layer new strokes go on; the top layer until the user picks one
let pending = [];            // strokes posted but not yet echoed back: {item, version}
let erasing = null;          // Set of ids hidden locally during an eraser drag

// ---------------------------------------------------------------- layout

// Zoom multiplies the fit-to-window scale; 1 means the whole page fits.
let zoom = 1;
// Measured on the box around the scrolling stage: the stage's own size shrinks when scrollbars
// appear, which would change the fit, drop the scrollbars, and flicker between two zoom levels.
const fitScale = () => {
  const box = $('stageBox');
  return Math.min((box.clientWidth - 32) / canvasSize.width, (box.clientHeight - 32) / canvasSize.height);
};
// Keep the bitmap under 16k px a side so big pages at high zoom don't blow past canvas limits.
const maxScale = () => 16384 / (Math.max(canvasSize.width, canvasSize.height) * (window.devicePixelRatio || 1));

function fit() {
  const box = $('stageBox');
  if (!box.clientWidth || !box.clientHeight) return;
  scale = Math.max(0.05, Math.min(maxScale(), fitScale() * zoom));
  $('zoomLabel').textContent = `${Math.round(scale * 100)}%`;
  const dpr = window.devicePixelRatio || 1;
  paper.style.width = `${canvasSize.width * scale}px`;
  paper.style.height = `${canvasSize.height * scale}px`;
  paper.width = Math.round(canvasSize.width * scale * dpr);
  paper.height = Math.round(canvasSize.height * scale * dpr);
  render();
}
// The stage also resizes when the bar wraps onto another row, not only with the window.
new ResizeObserver(fit).observe($('stageBox'));

// ---------------------------------------------------------------- drawing

function rngFor(id) {
  let h = 2166136261;
  for (const ch of String(id)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {
    h = Math.imul(h ^ (h >>> 15), h | 1);
    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}

// A slightly wobbly line so Claude's shapes sit next to hand-drawn ones without looking out of place.
function roughLine(c, x1, y1, x2, y2, rnd) {
  const j = () => (rnd() - 0.5) * 2;
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const bend = Math.min(4, len * 0.02) * j();
  const mx = (x1 + x2) / 2 + (-(y2 - y1) / len) * bend;
  const my = (y1 + y2) / 2 + ((x2 - x1) / len) * bend;
  c.moveTo(x1 + j(), y1 + j());
  c.quadraticCurveTo(mx, my, x2 + j(), y2 + j());
}

function smoothPath(c, pts) {
  if (!pts.length) return;
  c.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 1) { c.lineTo(pts[0][0] + 0.1, pts[0][1] + 0.1); return; }
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    c.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const last = pts[pts.length - 1];
  c.lineTo(last[0], last[1]);
}

function wrapText(c, text, maxWidth) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(/(\s+)/)) {
      const test = line + word;
      if (line && c.measureText(test).width > maxWidth) { out.push(line.trim()); line = word.trimStart(); }
      else line = test;
    }
    out.push(line.trim());
  }
  return out;
}

function drawLabel(c, it, cx, cy, maxWidth) {
  if (!it.text) return;
  const size = it.size || 20;
  c.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
  c.fillStyle = it.textColor || it.color || (it.author === 'claude' ? CLAUDE_COLOR : '#1f2328');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const lines = wrapText(c, it.text, Math.max(20, maxWidth));
  const lh = size * 1.25;
  lines.forEach((ln, i) => c.fillText(ln, cx, cy + (i - (lines.length - 1) / 2) * lh));
}

function drawItem(c, it) {
  const stroke = it.color || (it.author === 'claude' ? CLAUDE_COLOR : '#1f2328');
  const rnd = rngFor(it.id || 'tmp');
  c.save();
  c.strokeStyle = stroke;
  c.lineWidth = it.width || (it.type === 'stroke' ? 3 : 2.5);
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.setLineDash(it.dashed ? [10, 8] : []);
  switch (it.type) {
    case 'stroke':
      if (it.fill) { c.beginPath(); smoothPath(c, it.points); c.closePath(); c.fillStyle = it.fill; c.fill(); }
      c.beginPath(); smoothPath(c, it.points); c.stroke(); break;
    case 'line':
    case 'arrow': {
      const p = it.points;
      c.beginPath();
      for (let i = 0; i < p.length - 1; i++) roughLine(c, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1], rnd);
      c.stroke();
      if (it.type === 'arrow' && p.length > 1) {
        const [ax, ay] = p[p.length - 2], [bx, by] = p[p.length - 1];
        const ang = Math.atan2(by - ay, bx - ax), L = 14;
        c.setLineDash([]);
        c.beginPath();
        c.moveTo(bx - L * Math.cos(ang - 0.45), by - L * Math.sin(ang - 0.45));
        c.lineTo(bx, by);
        c.lineTo(bx - L * Math.cos(ang + 0.45), by - L * Math.sin(ang + 0.45));
        c.stroke();
      }
      if (it.text) {
        const mid = p[Math.floor((p.length - 1) / 2)], nxt = p[Math.min(p.length - 1, Math.floor((p.length - 1) / 2) + 1)];
        drawLabel(c, { ...it, size: it.size || 16 }, (mid[0] + nxt[0]) / 2, (mid[1] + nxt[1]) / 2 - 14, 200);
      }
      break;
    }
    case 'polygon': {
      const p = it.points;
      if (it.fill && p.length > 2) {
        c.beginPath();
        p.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
        c.closePath();
        c.fillStyle = it.fill; c.fill();
      }
      c.beginPath();
      for (let i = 0; i < p.length; i++) {
        const a = p[i], b = p[(i + 1) % p.length];
        roughLine(c, a[0], a[1], b[0], b[1], rnd);
      }
      c.stroke();
      if (it.text) {
        const cx = p.reduce((s, q) => s + q[0], 0) / p.length, cy = p.reduce((s, q) => s + q[1], 0) / p.length;
        const xs = p.map((q) => q[0]);
        drawLabel(c, it, cx, cy, (Math.max(...xs) - Math.min(...xs)) * 0.6);
      }
      break;
    }
    case 'rect': {
      const { x, y, w, h } = it;
      if (it.fill) { c.fillStyle = it.fill; c.fillRect(x, y, w, h); }
      c.beginPath();
      roughLine(c, x, y, x + w, y, rnd); roughLine(c, x + w, y, x + w, y + h, rnd);
      roughLine(c, x + w, y + h, x, y + h, rnd); roughLine(c, x, y + h, x, y, rnd);
      c.stroke();
      drawLabel(c, it, x + w / 2, y + h / 2, w - 16);
      break;
    }
    case 'ellipse': {
      const cx = it.x + it.w / 2, cy = it.y + it.h / 2, rx = Math.abs(it.w / 2), ry = Math.abs(it.h / 2);
      const phase = rnd() * Math.PI * 2;
      c.beginPath();
      for (let i = 0; i <= 48; i++) {
        const t = (i / 48) * (Math.PI * 2 + 0.25) + phase;
        const k = 1 + 0.015 * Math.sin(3 * t + phase);
        const px = cx + rx * k * Math.cos(t), py = cy + ry * k * Math.sin(t);
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      if (it.fill) { c.fillStyle = it.fill; c.fill(); }
      c.stroke();
      drawLabel(c, it, cx, cy, it.w * 0.75);
      break;
    }
    case 'text': {
      const size = it.size || 24;
      c.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
      c.fillStyle = stroke; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      String(it.text || '').split('\n').forEach((ln, i) => c.fillText(ln, it.x, it.y + i * size * 1.25));
      break;
    }
    case 'image': {
      const img = imageFor(it.src);
      if (img.complete && img.naturalWidth) {
        // Flips and quarter turns from the selection tools, applied around the image's center.
        const turned = (it.rot || 0) % 180 !== 0;
        c.translate(it.x + it.w / 2, it.y + it.h / 2);
        c.scale(it.flipX ? -1 : 1, it.flipY ? -1 : 1);
        c.rotate(((it.rot || 0) * Math.PI) / 180);
        const iw = turned ? it.h : it.w, ih = turned ? it.w : it.h;
        c.drawImage(img, -iw / 2, -ih / 2, iw, ih);
      }
      else { c.setLineDash([6, 6]); c.strokeStyle = '#8b8b86'; c.strokeRect(it.x, it.y, it.w, it.h); }
      break;
    }
  }
  c.restore();
}

// Items in layer order (bottom first). Hidden layers only affect the screen: the agent always sees every item.
// Decoded images by src, so pasted pictures aren't decoded on every frame.
const images = new Map();
function imageFor(src) {
  let img = images.get(src);
  if (!img) {
    img = new Image();
    img.onload = () => { render(); scheduleSnapshot(); };
    img.src = src;
    images.set(src, img);
  }
  return img;
}

function visibleItems(all = false) {
  const hidden = erasing || new Set();
  const order = new Map((state.layers || []).map((l, i) => [l.id, i]));
  const items = state.items
    .filter((it) => !hidden.has(it.id) && (all || !hiddenLayers.has(it.layer)))
    .map((it) => preview.get(it.id) || it)
    .map((it, i) => [order.get(it.layer) ?? 0, i, it])
    .sort((a, b) => a[0] - b[0] || a[1] - b[1])
    .map(([, , it]) => it);
  return [...items, ...pending.map((p) => p.item)];
}

let dots = null;
function dotPattern(c) {
  if (!dots) {
    const tile = document.createElement('canvas');
    tile.width = tile.height = 24;
    const g = tile.getContext('2d');
    g.fillStyle = 'rgba(20,20,20,.10)';
    g.beginPath(); g.arc(12, 12, 1.2, 0, Math.PI * 2); g.fill();
    dots = tile;
  }
  return c.createPattern(dots, 'repeat');
}

function paint(c, k, forSnapshot = false) {
  c.setTransform(k, 0, 0, k, 0, 0);
  c.fillStyle = '#ffffff';
  c.fillRect(0, 0, canvasSize.width, canvasSize.height);
  // Faint dot grid like a sketchbook page; on screen only, never in what the agent sees.
  if (!forSnapshot) { c.fillStyle = dotPattern(c); c.fillRect(0, 0, canvasSize.width, canvasSize.height); }
  const items = visibleItems(forSnapshot);
  for (const it of items) drawItem(c, it);
  if (forSnapshot) return;
  if (drawing) drawItem(c, drawing);
  paintSelection(c);
}

function render() { paint(ctx, scale * (window.devicePixelRatio || 1)); }

function snapshot() {
  const off = document.createElement('canvas');
  off.width = canvasSize.width; off.height = canvasSize.height;
  paint(off.getContext('2d'), 1, true);
  return off.toDataURL('image/png');
}

let snapTimer = null;
function scheduleSnapshot() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    post('/api/snapshot', { png: snapshot(), version: state.version }).catch(() => {});
  }, 250);
}

// ---------------------------------------------------------------- server sync

async function post(route, body) {
  const res = await fetch(route, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  return res.json();
}

function applyState(next) {
  const changed = next.version !== state.version;
  state = next;
  if (next.canvas && (next.canvas.width !== canvasSize.width || next.canvas.height !== canvasSize.height)) {
    canvasSize = next.canvas; fit(); showSize();
  }
  pending = pending.filter((p) => p.version === null || p.version > state.version);
  if ([...selection].some((id) => !state.items.some((it) => it.id === id))) selection = new Set([...selection].filter((id) => state.items.some((it) => it.id === id)));
  renderChat();
  $('answers').classList.toggle('show', Boolean(state.ask));
  $('sideToggle').classList.toggle('has-ask', Boolean(state.ask));
  $('status').classList.toggle('on', state.waiting);
  const layers = state.layers || [];
  if (!layers.some((l) => l.id === activeLayer)) activeLayer = layers.length ? layers[layers.length - 1].id : null;
  renderLayers();
  $('hint').classList.toggle('show', !state.items.length && !pending.length);
  const status = state.waiting ? 'Agent is listening' : 'Agent is busy · sends are kept';
  $('status').title = status;
  $('status').querySelector('span').textContent = status;
  render();
  if (changed) scheduleSnapshot();
}

const events = new EventSource('/api/events');
events.onmessage = (e) => applyState(JSON.parse(e.data));

async function addItems(items) {
  const entries = items.map((item) => ({ item, version: null }));
  pending.push(...entries);
  render();
  const r = await post('/api/ops', { author: 'user', add: items.map((it) => ({ ...it, layer: activeLayer })) });
  entries.forEach((e) => { e.version = r.version; });
  pending = pending.filter((p) => p.version === null || p.version > state.version);
  render();
  return r;
}

// ---------------------------------------------------------------- selection (Paint-style)
// Drag a rectangle (or a free-form loop with the lasso) to select. Whatever lies inside moves,
// copies, flips, rotates, scales or gets deleted together. Images and freehand strokes that the
// region only partly covers are cut along it, like pixels in Paint.

let selection = new Set();   // selected item ids
let preview = new Map();     // id -> item drawn in place of the stored one while dragging
let drag = null;             // select/lasso drag in progress
const GEOMETRY = ['points', 'x', 'y', 'w', 'h', 'size', 'flipX', 'flipY', 'rot'];
const HANDLE = 9;            // handle size in screen px

const selectedItems = () => state.items.filter((it) => selection.has(it.id)).map((it) => preview.get(it.id) || it);

function unionBox(items) {
  if (!items.length) return null;
  const boxes = items.map(itemBox);
  return [Math.min(...boxes.map((b) => b[0])), Math.min(...boxes.map((b) => b[1])),
    Math.max(...boxes.map((b) => b[2])), Math.max(...boxes.map((b) => b[3]))];
}

function setSelection(ids) {
  selection = new Set(ids);
  render();
}

const round1 = (v) => Math.round(v * 10) / 10;

// Map an item through a point transform f. Flips and quarter turns also update an image's
// orientation; k scales text size.
function transformItem(it, f, { flipX = false, flipY = false, rot = 0, k = 1 } = {}) {
  const out = { ...it };
  if (it.points) out.points = it.points.map((p) => f(p).map(round1));
  else if (it.type === 'text') {
    const [x1, y1, x2, y2] = itemBox(it);
    const c = f([(x1 + x2) / 2, (y1 + y2) / 2]);
    const size = Math.max(6, Math.round((it.size || 24) * k));
    out.size = size;
    out.x = round1(c[0] - ((x2 - x1) * k) / 2);
    out.y = round1(c[1] - ((y2 - y1) * k) / 2 + size);
  } else {
    const a = f([it.x, it.y]), b = f([it.x + it.w, it.y + it.h]);
    out.x = round1(Math.min(a[0], b[0])); out.y = round1(Math.min(a[1], b[1]));
    out.w = round1(Math.abs(b[0] - a[0])); out.h = round1(Math.abs(b[1] - a[1]));
  }
  if (it.type === 'image') {
    // Flips are applied on screen after the rotation, so a quarter turn swaps which axis is flipped.
    if (rot) { const fx = out.flipX; out.flipX = out.flipY; out.flipY = fx; out.rot = ((it.rot || 0) + rot) % 360; }
    if (flipX) out.flipX = !out.flipX;
    if (flipY) out.flipY = !out.flipY;
  }
  return out;
}

const patchOf = (it) => Object.fromEntries([['id', it.id], ...GEOMETRY.filter((k) => k in it).map((k) => [k, it[k]])]);

// Store transformed items: show them right away, then send one update (one undo step).
async function commitItems(items, extra = {}) {
  if (!items.length) return;
  for (const it of items) {
    const i = state.items.findIndex((x) => x.id === it.id);
    if (i >= 0) state.items[i] = it;
  }
  preview.clear();
  render();
  await post('/api/ops', { author: 'user', update: items.map(patchOf), ...extra });
}

function transformSelection(makeF, opts) {
  const items = selectedItems();
  const box = unionBox(items);
  if (!box) return;
  const f = makeF(box);
  commitItems(items.map((it) => transformItem(it, f, opts)));
}
const flipSelectionH = () => transformSelection(([x1, , x2]) => ([x, y]) => [x1 + x2 - x, y], { flipX: true });
const flipSelectionV = () => transformSelection(([, y1, , y2]) => ([x, y]) => [x, y1 + y2 - y], { flipY: true });
const rotateSelection = () => transformSelection(([x1, y1, x2, y2]) => {
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  return ([x, y]) => [cx - (y - cy), cy + (x - cx)];
}, { rot: 90 });

function nudgeSelection(dx, dy) {
  commitItems(selectedItems().map((it) => translated(it, dx, dy)));
}

async function deleteSelection() {
  const ids = [...selection];
  if (!ids.length) return;
  setSelection([]);
  await post('/api/ops', { author: 'user', remove: ids });
}

const shapeOf = ({ id, author, ...shape }) => shape;

// Add shapes on their own layers (or the active one) and select what was added.
async function addAndSelect(shapes) {
  if (!shapes.length) return;
  const r = await post('/api/ops', { author: 'user', add: shapes.map((s) => ({ ...s, layer: s.layer || activeLayer })) });
  if (r.ids) { setTool('select'); setSelection(r.ids); }
}

const duplicateSelection = () => addAndSelect(selectedItems().map((it) => translated(shapeOf(it), 20, 20)));

function selectAll() {
  setTool('select');
  setSelection(pickable().map((it) => it.id));
}

// ---- region selection

function regionPath(c, region) {
  c.beginPath();
  if (region.rect) { const [x1, y1, x2, y2] = region.rect; c.rect(x1, y1, x2 - x1, y2 - y1); }
  else region.poly.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
  c.closePath();
}

function insidePolygon(p, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function inRegion(p, region) {
  if (region.rect) { const [x1, y1, x2, y2] = region.rect; return p[0] >= x1 && p[0] <= x2 && p[1] >= y1 && p[1] <= y2; }
  return insidePolygon(p, region.poly);
}

const corners = ([x1, y1, x2, y2]) => [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
const boxesOverlap = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];

// An image cut along the region: the part inside (cropped to it) and the rest, as new images.
function cutImage(it, region, rbox) {
  const [x1, y1, x2, y2] = itemBox(it);
  const k = Math.min(2, 4096 / Math.max(1, x2 - x1, y2 - y1));
  const piece = (inside, bx1, by1, bx2, by2) => {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round((bx2 - bx1) * k)); cv.height = Math.max(1, Math.round((by2 - by1) * k));
    const g = cv.getContext('2d');
    g.setTransform(k, 0, 0, k, -bx1 * k, -by1 * k);
    if (inside) { regionPath(g, region); g.clip(); drawItem(g, it); }
    else { drawItem(g, it); g.globalCompositeOperation = 'destination-out'; regionPath(g, region); g.fill(); }
    const { id, author, flipX, flipY, rot, ...rest } = it;
    return { ...rest, src: cv.toDataURL('image/png'), x: bx1, y: by1, w: bx2 - bx1, h: by2 - by1 };
  };
  const ix1 = Math.max(x1, rbox[0]), iy1 = Math.max(y1, rbox[1]), ix2 = Math.min(x2, rbox[2]), iy2 = Math.min(y2, rbox[3]);
  return { inside: piece(true, ix1, iy1, ix2, iy2), outside: piece(false, x1, y1, x2, y2) };
}

// A freehand stroke split into the runs of points inside and outside the region.
function cutStroke(it, region) {
  const runs = [];
  let cur = null, prev = null;
  for (const p of it.points) {
    const inside = inRegion(p, region);
    if (!cur || cur.inside !== inside) {
      // Split exactly where the stroke crosses the region's edge.
      let edge = null;
      if (prev) {
        let a = prev, b = p;
        for (let i = 0; i < 12; i++) {
          const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          if (inRegion(m, region) === inside) b = m; else a = m;
        }
        edge = b.map(round1);
        cur.points.push(edge);
      }
      cur = { inside, points: edge ? [edge] : [] };
      runs.push(cur);
    }
    cur.points.push(p);
    prev = p;
  }
  const { id, author, fill, ...rest } = it;
  const shapes = (inside) => runs.filter((r) => r.inside === inside && r.points.length > 1).map((r) => ({ ...rest, points: r.points }));
  return { inside: shapes(true), outside: shapes(false) };
}

async function selectRegion(region, add) {
  const rbox = region.rect || [
    Math.min(...region.poly.map((p) => p[0])), Math.min(...region.poly.map((p) => p[1])),
    Math.max(...region.poly.map((p) => p[0])), Math.max(...region.poly.map((p) => p[1])),
  ];
  const whole = [], remove = [], insideShapes = [], outsideShapes = [];
  const lift = [];  // what the selection holds, bottom to top: ids, or indexes into insideShapes
  for (const it of pickable()) {
    const box = itemBox(it);
    if (!boxesOverlap(box, rbox) && !(box[0] === box[2] || box[1] === box[3])) continue;
    const pts = it.points && it.type !== 'polygon' ? it.points : corners(box);
    const inside = pts.filter((p) => inRegion(p, region)).length;
    if (inside === pts.length) { whole.push(it.id); lift.push(it.id); continue; }
    // What's left outside takes the original's place in the stacking order; the cut-out part
    // floats on top, like a fresh selection in Paint.
    if (it.type === 'image' && boxesOverlap(box, rbox)) {
      const cut = cutImage(it, region, rbox);
      outsideShapes.push({ ...cut.outside, replaces: it.id });
      lift.push(insideShapes.length); insideShapes.push(cut.inside);
    } else if (it.type === 'stroke' && inside > 0) {
      const cut = cutStroke(it, region);
      if (cut.outside.length) outsideShapes.push({ ...cut.outside[0], replaces: it.id }, ...cut.outside.slice(1));
      else remove.push(it.id);
      for (const piece of cut.inside) { lift.push(insideShapes.length); insideShapes.push(piece); }
    }
  }
  let ids = whole;
  if (insideShapes.length) {
    // Everything selected moves to the top together, keeping its own order, so a cut-out picture
    // doesn't cover the shapes that were drawn over it.
    const raise = lift.map((ref) => (typeof ref === 'number' ? `#${outsideShapes.length + ref}` : ref));
    const r = await post('/api/ops', { author: 'user', remove, add: [...outsideShapes, ...insideShapes], raise });
    ids = [...whole, ...(r.ids || []).slice(outsideShapes.length)];
  }
  setSelection(add ? [...selection, ...ids] : ids);
}

// ---- pointer handling for the select and lasso tools

function handleAt(p) {
  const box = unionBox(selectedItems());
  if (!box) return null;
  const r = HANDLE / scale;
  return corners(box).findIndex(([x, y]) => Math.abs(p[0] - x) <= r && Math.abs(p[1] - y) <= r);
}

function selectDown(p, e) {
  const box = unionBox(selectedItems());
  const h = handleAt(p);
  if (h !== null && h >= 0) {
    // Scale from the opposite corner.
    const anchor = corners(box)[(h + 2) % 4];
    drag = { kind: 'scale', anchor, from: corners(box)[h], items: selectedItems() };
    return;
  }
  const inBox = box && p[0] >= box[0] && p[0] <= box[2] && p[1] >= box[1] && p[1] <= box[3];
  if (inBox && !e.shiftKey) { drag = { kind: 'move', from: p, items: selectedItems() }; paper.classList.add('moving'); return; }
  if (tool === 'select') {
    const hit = [...pickable()].reverse().find((it) => hits(it, p));
    if (hit) {
      if (e.shiftKey) {
        const next = new Set(selection);
        next.has(hit.id) ? next.delete(hit.id) : next.add(hit.id);
        setSelection([...next]);
        return;
      }
      setSelection([hit.id]);
      drag = { kind: 'move', from: p, items: [hit] };
      paper.classList.add('moving');
      return;
    }
  }
  if (!e.shiftKey) setSelection([]);
  drag = { kind: tool === 'lasso' ? 'lasso' : 'marquee', from: p, to: p, points: [p], add: e.shiftKey };
}

function selectMove(p, e) {
  if (drag.kind === 'move') {
    const dx = p[0] - drag.from[0], dy = p[1] - drag.from[1];
    preview = new Map(drag.items.map((it) => [it.id, translated(it, dx, dy)]));
  } else if (drag.kind === 'scale') {
    const [ax, ay] = drag.anchor;
    let sx = (p[0] - ax) / (drag.from[0] - ax || 1), sy = (p[1] - ay) / (drag.from[1] - ay || 1);
    if (e.shiftKey) { const s = Math.max(Math.abs(sx), Math.abs(sy)); sx = Math.sign(sx) * s; sy = Math.sign(sy) * s; }
    const f = ([x, y]) => [ax + (x - ax) * sx, ay + (y - ay) * sy];
    const k = Math.sqrt(Math.abs(sx * sy));
    preview = new Map(drag.items.map((it) => [it.id, transformItem(it, f, { flipX: sx < 0, flipY: sy < 0, k })]));
  } else {
    drag.to = p;
    if (drag.kind === 'lasso') {
      const last = drag.points[drag.points.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) >= 2) drag.points.push(p);
    }
  }
  render();
}

async function selectUp() {
  const d = drag;
  drag = null;
  paper.classList.remove('moving');
  if (d.kind === 'move' || d.kind === 'scale') {
    const moved = d.items.map((it) => preview.get(it.id)).filter(Boolean);
    if (moved.length) await commitItems(moved); else { preview.clear(); render(); }
    return;
  }
  if (d.kind === 'marquee') {
    const rect = [Math.min(d.from[0], d.to[0]), Math.min(d.from[1], d.to[1]), Math.max(d.from[0], d.to[0]), Math.max(d.from[1], d.to[1])];
    if (rect[2] - rect[0] < 3 && rect[3] - rect[1] < 3) { render(); return; }  // a click on empty space
    await selectRegion({ rect }, d.add);
  } else if (d.points.length > 2) await selectRegion({ poly: d.points }, d.add);
  render();
}

// The marquee or lasso being dragged, and the selection's box with corner handles.
function paintSelection(c) {
  c.save();
  c.lineWidth = 1.5 / scale;
  c.setLineDash([6 / scale, 4 / scale]);
  c.strokeStyle = '#2f6fde';
  if (drag && drag.kind === 'marquee') {
    const [a, b] = [drag.from, drag.to];
    c.fillStyle = 'rgba(47,111,222,.08)';
    c.fillRect(Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
    c.strokeRect(Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
  }
  if (drag && drag.kind === 'lasso') {
    c.beginPath(); drag.points.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke();
  }
  const box = unionBox(selectedItems());
  if (box) {
    const [x1, y1, x2, y2] = box;
    c.strokeRect(x1, y1, x2 - x1, y2 - y1);
    c.setLineDash([]);
    const r = HANDLE / scale / 2;
    for (const [x, y] of corners(box)) {
      c.fillStyle = '#ffffff'; c.fillRect(x - r, y - r, r * 2, r * 2);
      c.strokeRect(x - r, y - r, r * 2, r * 2);
    }
  }
  c.restore();
  placeSelBar(box);
}

// Floating actions above the selection.
function placeSelBar(box) {
  const bar = $('selbar');
  if (!box || drag) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const top = box[1] * scale + 16 - bar.offsetHeight - 10;
  bar.style.left = `${Math.max(0, box[0] * scale + 16)}px`;
  bar.style.top = `${top < 0 ? box[3] * scale + 16 + 10 : top}px`;
}

$('selFlipH').addEventListener('click', flipSelectionH);
$('selFlipV').addEventListener('click', flipSelectionV);
$('selRotate').addEventListener('click', rotateSelection);
$('selDup').addEventListener('click', duplicateSelection);
$('selDel').addEventListener('click', deleteSelection);

// ---------------------------------------------------------------- input

function toLogical(e) {
  const r = paper.getBoundingClientRect();
  return [Math.round(((e.clientX - r.left) / scale) * 10) / 10, Math.round(((e.clientY - r.top) / scale) * 10) / 10];
}

function distToSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

// [x1, y1, x2, y2] in logical pixels.
function itemBox(it) {
  if (it.points) {
    const xs = it.points.map((q) => q[0]), ys = it.points.map((q) => q[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  }
  if (it.type === 'text') {
    const size = it.size || 24;
    ctx.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
    const w = Math.max(...String(it.text).split('\n').map((l) => ctx.measureText(l).width));
    const lines = String(it.text).split('\n').length;
    return [it.x, it.y - size, it.x + w, it.y + (lines - 1) * size * 1.25];
  }
  return [Math.min(it.x, it.x + it.w), Math.min(it.y, it.y + it.h), Math.max(it.x, it.x + it.w), Math.max(it.y, it.y + it.h)];
}

function hits(it, p) {
  const R = 10;
  if (it.points && it.type !== 'polygon') {
    if (it.points.length === 1) return Math.hypot(p[0] - it.points[0][0], p[1] - it.points[0][1]) < R;
    for (let i = 0; i < it.points.length - 1; i++) if (distToSegment(p, it.points[i], it.points[i + 1]) < R) return true;
    return false;
  }
  const [x1, y1, x2, y2] = itemBox(it);
  return p[0] >= x1 - R && p[0] <= x2 + R && p[1] >= y1 - R && p[1] <= y2 + R;
}

// Only what's on screen can be erased or picked, so hidden layers stay untouched.
const pickable = () => visibleItems().filter((it) => state.items.some((x) => x.id === it.id));

function eraseAt(p) {
  for (const it of pickable()) if (!erasing.has(it.id) && hits(it, p)) erasing.add(it.id);
  render();
}

function translated(it, dx, dy) {
  if (it.points) return { ...it, points: it.points.map(([x, y]) => [Math.round((x + dx) * 10) / 10, Math.round((y + dy) * 10) / 10]) };
  return { ...it, x: Math.round(it.x + dx), y: Math.round(it.y + dy) };
}

// A rect/ellipse from two corners, or an arrow from start to end.
function shapeFrom(type, a, b) {
  if (type === 'arrow') return { type, points: [a, b] };
  return { type, x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) };
}
const SHAPE_TOOLS = new Set(['rect', 'ellipse', 'arrow']);

paper.addEventListener('pointerdown', (e) => {
  if (e.button === 1 || (e.button === 0 && spaceDown)) { e.preventDefault(); startPan(e); return; }
  if (e.button !== 0) return;
  $('hint').classList.remove('show');
  const p = toLogical(e);
  if (textAt) { commitText(); e.preventDefault(); return; }
  if (tool === 'text') { openTextInput(p); e.preventDefault(); return; }
  if (tool === 'fill') { fillAt(p); return; }
  paper.setPointerCapture(e.pointerId);
  if (tool === 'eraser') { erasing = new Set(); eraseAt(p); return; }
  if (tool === 'select' || tool === 'lasso') { selectDown(p, e); render(); return; }
  if (SHAPE_TOOLS.has(tool)) {
    drawing = { ...shapeFrom(tool, p, p), start: p, color, width: lineWidth, author: 'user', id: 'live' };
  }
  else drawing = { type: 'stroke', points: [p], color, width: lineWidth, author: 'user', id: 'live' };
  render();
});

paper.addEventListener('pointermove', (e) => {
  if (panning) {
    const st = $('stage');
    st.scrollLeft = panning.left - (e.clientX - panning.x);
    st.scrollTop = panning.top - (e.clientY - panning.y);
    return;
  }
  if (tool === 'eraser' && erasing) { eraseAt(toLogical(e)); return; }
  if (drag) { selectMove(toLogical(e), e); return; }
  if (!drawing) return;
  if (drawing.start) {
    drawing = { ...drawing, ...shapeFrom(drawing.type, drawing.start, toLogical(e)) };
    render();
    return;
  }
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of events) {
    const p = toLogical(ev), last = drawing.points[drawing.points.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) >= 1.5) drawing.points.push(p);
  }
  render();
});

async function endPointer() {
  if (panning) { panning = null; $('stage').classList.remove('panning'); return; }
  if (erasing) {
    const ids = [...erasing];
    if (ids.length) await post('/api/ops', { author: 'user', remove: ids });
    erasing = null;
    render();
    return;
  }
  if (drag) { await selectUp(); return; }
  if (!drawing) return;
  const { author: _a, id: _i, start, ...shape } = drawing;
  drawing = null;
  if (start) {
    const [x1, y1, x2, y2] = itemBox(shape);
    if (Math.max(x2 - x1, y2 - y1) < 4) { render(); return; }  // a click, not a drag
  }
  await addItems([shape]);
}
paper.addEventListener('pointerup', endPointer);
paper.addEventListener('pointercancel', endPointer);

const textInput = $('textInput');
let textAt = null;
// With the text tool the width slider sets the text size.
const textSize = () => 14 + lineWidth * 3;
let textSizeAt = 24;

function growTextInput() {
  textInput.style.width = '0px'; textInput.style.height = '0px';
  textInput.style.width = `${Math.max(120, textInput.scrollWidth + 8)}px`;
  textInput.style.height = `${textInput.scrollHeight}px`;
}

function openTextInput(p) {
  textAt = p;
  textSizeAt = textSize();
  textInput.value = '';

  const chat = state.chat || [];
  const sig = chat.map((m) => `${m.at}${m.img ? 'i' : ''}`).join(',');
  if (sig === chatShown) return;
  chatShown = sig;
  const box = $('chat');

    return;
  }

// Zoom around a point on screen (the cursor, or the middle of the stage) so it stays put.
function setZoom(z, at) {
  const st = $('stage');
  const box = st.getBoundingClientRect();
  const ax = at ? at.x : box.left + box.width / 2, ay = at ? at.y : box.top + box.height / 2;
  const before = paper.getBoundingClientRect();
  const lx = (ax - before.left) / scale, ly = (ay - before.top) / scale;
  const f = fitScale();
  zoom = Math.max(0.1 / f, Math.min(Math.min(8, maxScale()) / f, z));
  fit();
  const after = paper.getBoundingClientRect();
  st.scrollLeft += after.left + lx * scale - ax;
  st.scrollTop += after.top + ly * scale - ay;
}
$('zoomIn').addEventListener('click', () => setZoom(zoom * 1.25));

  if (!(e.ctrlKey || e.metaKey)) return;  // plain wheel scrolls; Ctrl/⌘ or a pinch zooms
  e.preventDefault();
  setZoom(zoom * Math.exp(-e.deltaY * 0.0015), { x: e.clientX, y: e.clientY });
}, { passive: false });

const svgIcon = (name, cls = 'ic sm') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
let renaming = null;  // id of the layer whose name is being edited

function renderLayers() {
  if (renaming) return;  // don't wipe the input while the user types
  const list = $('layerList');
  list.textContent = '';
  const layers = state.layers || [];
  for (const layer of [...layers].reverse()) {
    const row = document.createElement('div');
    row.className = 'lrow' + (layer.id === activeLayer ? ' active' : '') + (hiddenLayers.has(layer.id) ? ' hidden' : '');
    const shown = !hiddenLayers.has(layer.id);
    const hasAgent = state.items.some((it) => it.layer === layer.id && it.author === 'claude');
    row.innerHTML = `<button class="eye" title="${shown ? 'Hide' : 'Show'}" aria-label="${shown ? 'Hide' : 'Show'} layer">${svgIcon(shown ? 'eye' : 'eye-off')}</button>`
      + `<span class="name"></span>${hasAgent ? `<span class="agent" title="The agent drew on this layer">${svgIcon('agent')}</span>` : ''}`
      + `<button class="ren" title="Rename" aria-label="Rename layer">${svgIcon('pen')}</button>`
      + (layers.length > 1 ? `<button class="del" title="Delete layer" aria-label="Delete layer">${svgIcon('x')}</button>` : '');
    row.querySelector('.name').textContent = layer.name;
    // Drag rows to reorder; the list shows the top layer first.
    row.draggable = true;
    row.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/x-doodle-layer', layer.id); e.dataTransfer.effectAllowed = 'move'; });
    row.addEventListener('dragover', (e) => {
      if (!e.dataTransfer.types.includes('text/x-doodle-layer')) return;
      e.preventDefault();
      const r = row.getBoundingClientRect();
      row.classList.toggle('drop-above', e.clientY < r.top + r.height / 2);
      row.classList.toggle('drop-below', e.clientY >= r.top + r.height / 2);
    });
    row.addEventListener('dragleave', () => row.classList.remove('drop-above', 'drop-below'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const above = row.classList.contains('drop-above');
      row.classList.remove('drop-above', 'drop-below');
      const id = e.dataTransfer.getData('text/x-doodle-layer');
      const order = layers.map((l) => l.id).filter((x) => x !== id);
      const at = order.indexOf(layer.id);
      if (!id || id === layer.id || at < 0) return;
      // "Above" in the list means higher in the stack, i.e. after it in bottom-to-top order.
      post('/api/ops', { author: 'user', moveLayer: { id, index: above ? at + 1 : at } });
    });
    row.title = 'Click to draw on this layer, double-click to rename';
    row.addEventListener('click', (e) => {
      if (e.target.closest('.ren')) { startRename(row, layer); return; }
      if (e.target.closest('.eye')) {
        hiddenLayers.has(layer.id) ? hiddenLayers.delete(layer.id) : hiddenLayers.add(layer.id);
        selection = new Set();
      } else if (e.target.closest('.del')) {
        const count = state.items.filter((it) => it.layer === layer.id).length;
        askConfirm(count ? `Delete "${layer.name}" and the ${count} drawing${count > 1 ? 's' : ''} on it?` : `Delete "${layer.name}"?`, 'Delete',
          () => post('/api/ops', { author: 'user', removeLayer: layer.id }));
        return;
      } else activeLayer = layer.id;
      renderLayers(); render();
    });
    row.querySelector('.name').addEventListener('dblclick', () => startRename(row, layer));
    list.appendChild(row);
  }
}

function startRename(row, layer) {
  renaming = layer.id;
  const input = document.createElement('input');
  input.value = layer.name;
  row.querySelector('.name').replaceWith(input);

    if (save && name && name !== layer.name) post('/api/ops', { author: 'user', renameLayer: { id: layer.id, name } });
    renderLayers();
  };

}

// ---- fill tool: a paint bucket like in Paint. Clicking floods every connected pixel of the same
// color (what's on screen, all visible layers) with the current color, fully opaque, and adds the
// result as an image on the active layer.

const FILL_TOLERANCE = 48;  // per channel, so anti-aliased edges count as the line, not the gap

function floodFill(px, w, h, sx, sy) {
  const seed = px[sy * w + sx];
  const sr = seed & 255, sg = (seed >>> 8) & 255, sb = (seed >>> 16) & 255, sa = seed >>> 24;
  const near = (c) => Math.abs((c & 255) - sr) <= FILL_TOLERANCE && Math.abs(((c >>> 8) & 255) - sg) <= FILL_TOLERANCE
    && Math.abs(((c >>> 16) & 255) - sb) <= FILL_TOLERANCE && Math.abs((c >>> 24) - sa) <= FILL_TOLERANCE;
  const mask = new Uint8Array(w * h);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  const stack = [sx, sy];
  while (stack.length) {
    const y = stack.pop();
    let x = stack.pop();
    let i = y * w + x;
    while (x >= 0 && !mask[i] && near(px[i])) { x--; i--; }
    x++; i++;
    let up = false, down = false;
    while (x < w && !mask[i] && near(px[i])) {
      mask[i] = 1;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (y > 0) { const a = i - w; if (!mask[a] && near(px[a])) { if (!up) { stack.push(x, y - 1); up = true; } } else up = false; }
      if (y < h - 1) { const b = i + w; if (!mask[b] && near(px[b])) { if (!down) { stack.push(x, y + 1); down = true; } } else down = false; }
      x++; i++;
    }
  }
  return x1 < 0 ? null : { mask, x0, y0, x1, y1 };
}

async function fillAt(p) {
  const W = canvasSize.width, H = canvasSize.height;
  const k = Math.min(2, Math.sqrt(6e6 / (W * H)));  // 2x for crisp edges, less on huge pages
  const off = document.createElement('canvas');
  off.width = Math.round(W * k); off.height = Math.round(H * k);
  const g = off.getContext('2d', { willReadFrequently: true });
  g.setTransform(k, 0, 0, k, 0, 0);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  for (const it of visibleItems()) drawItem(g, it);
  const w = off.width, h = off.height;
  const sx = Math.min(w - 1, Math.max(0, Math.floor(p[0] * k))), sy = Math.min(h - 1, Math.max(0, Math.floor(p[1] * k)));
  const px = new Uint32Array(g.getImageData(0, 0, w, h).data.buffer);
  const region = floodFill(px, w, h, sx, sy);
  if (!region) return;
  // Grow the region by a pixel so it tucks under anti-aliased edges instead of leaving a light seam.
  const x0 = Math.max(0, region.x0 - 1), y0 = Math.max(0, region.y0 - 1);
  const x1 = Math.min(w - 1, region.x1 + 1), y1 = Math.min(h - 1, region.y1 + 1);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const out = new ImageData(bw, bh);
  const n = parseInt(color.slice(1), 16), r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
  const m = region.mask;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * w + x;
      const hit = m[i] || (x > 0 && m[i - 1]) || (x < w - 1 && m[i + 1]) || (y > 0 && m[i - w]) || (y < h - 1 && m[i + w]);
      if (!hit) continue;
      const o = ((y - y0) * bw + (x - x0)) * 4;
      out.data[o] = r; out.data[o + 1] = gg; out.data[o + 2] = b; out.data[o + 3] = 255;
    }
  }
  const crop = document.createElement('canvas');
  crop.width = bw; crop.height = bh;
  crop.getContext('2d').putImageData(out, 0, 0);
  const src = crop.toDataURL('image/png');
  await new Promise((done) => { const img = imageFor(src); if (img.complete) done(); else img.addEventListener('load', done, { once: true }); });
  addItems([{ type: 'image', src, x: x0 / k, y: y0 / k, w: bw / k, h: bh / k, fill: true }]);
}

// ---------------------------------------------------------------- clipboard
// Copy/cut the selection as JSON (also readable as text elsewhere). Paste takes copied items,
// an image (screenshot, copied picture) or plain text, and leaves what was pasted selected.

const CLIP_TAG = 'doodle-prompt/items';
const typing = () => document.activeElement && document.activeElement.closest('input, textarea');
let pasteCount = 0;

function copySelection(e, cut) {
  const items = selectedItems();
  if (!items.length || typing()) return;
  e.clipboardData.setData('text/plain', JSON.stringify({ [CLIP_TAG]: items.map(({ id, author, layer, ...shape }) => shape) }));
  e.preventDefault();
  pasteCount = 0;
  if (cut) deleteSelection();
  toast(cut ? 'Cut' : 'Copied');
}
document.addEventListener('copy', (e) => copySelection(e, false));
document.addEventListener('cut', (e) => copySelection(e, true));

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result); r.onerror = reject;
    r.readAsDataURL(file);
  });
}

document.addEventListener('paste', async (e) => {
  if (typing()) return;
  const data = e.clipboardData;
  const file = [...data.files].find((f) => /^image\/(png|jpeg|gif|webp)$/.test(f.type));
  const text = data.getData('text/plain');
  e.preventDefault();
  if (file) {
    const src = await readFile(file);
    const img = imageFor(src);
    await new Promise((r) => { if (img.complete) r(); else img.addEventListener('load', r, { once: true }); });
    // Fit inside half the canvas, centered.
    const k = Math.min(1, (canvasSize.width / 2) / img.naturalWidth, (canvasSize.height / 2) / img.naturalHeight);
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    return addAndSelect([{ type: 'image', src, x: Math.round((canvasSize.width - w) / 2), y: Math.round((canvasSize.height - h) / 2), w, h }]);
  }
  if (!text) return;
  let shapes = null;
  try { const data = JSON.parse(text); shapes = data[CLIP_TAG] || (data['doodle-prompt/item'] ? [data['doodle-prompt/item']] : null); } catch {}
  if (shapes) {
    pasteCount += 1;
    return addAndSelect(shapes.map((s) => translated(s, 20 * pasteCount, 20 * pasteCount)));
  }
  addAndSelect([{ type: 'text', x: 80, y: 120, text: text.slice(0, 2000), color, size: 24 }]);
});

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); setZoom(zoom * 1.25); return; }
  if (mod && e.key === '-') { e.preventDefault(); setZoom(zoom / 1.25); return; }
  if (mod && e.key === '0') { e.preventDefault(); setZoom(1); return; }
  if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); post('/api/redo'); return; }
  if (mod && key === 'z') { e.preventDefault(); post('/api/undo'); return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); send(); return; }
  if (mod && key === 'a') { e.preventDefault(); selectAll(); return; }
  if (mod && key === 'd' && selection.size) { e.preventDefault(); duplicateSelection(); return; }
  if (mod || e.altKey) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selection.size) { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'Escape' && selection.size) { setSelection([]); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key] && selection.size) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    nudgeSelection(arrows[e.key][0] * step, arrows[e.key][1] * step);
    return;
  }
  if (e.key === 'l') { toggleLayers(); return; }
  if (e.key === 'c') { $('sideToggle').click(); return; }
  const tools = { f: 'fill', v: 'select', s: 'lasso', p: 'pen', e: 'eraser', t: 'text', r: 'rect', o: 'ellipse', a: 'arrow' };
  if (tools[e.key]) setTool(tools[e.key]);
});

fit();
</script>
