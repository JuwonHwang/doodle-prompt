<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-prompt</title>
<style>
  :root {
    --bg: #ecebe6;
    --paper: #ffffff;
    --ink: #1f2328;
    --muted: #6b6b66;
    --line: #d9d7cf;
    --chrome: #fbfaf7;
    --accent: #c96442;
    --ok: #2e9e5b;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 76px 0; display: grid; place-items: center; }
  #wrap { position: relative; }
  #paper { display: block; background: var(--paper); border-radius: 6px; box-shadow: var(--shadow);
    touch-action: none; cursor: crosshair; }
  #paper.eraser { cursor: cell; }
  #paper.text { cursor: text; }

  #bubble { position: absolute; top: 12px; left: 12px; max-width: min(420px, 70%);
    background: var(--chrome); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 8px 12px; box-shadow: var(--shadow); white-space: pre-wrap; display: none; }
  #bubble b { color: var(--accent); font-weight: 600; margin-right: 6px; }

  #textInput { position: absolute; display: none; font: 24px ui-sans-serif, system-ui, sans-serif;
    border: 1px dashed var(--muted); background: rgba(255,255,255,.9); padding: 0 4px; outline: none; min-width: 120px; }

  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; gap: 12px;
    align-items: center; padding: 0 16px; background: var(--chrome); border-top: 1px solid var(--line); }
  .group { display: flex; gap: 4px; align-items: center; }
  .sep { width: 1px; height: 28px; background: var(--line); }
  button { font: inherit; border: 1px solid transparent; background: transparent; color: var(--ink);
    height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px; cursor: pointer; }
  button:hover { background: #efede6; }
  button[aria-pressed="true"] { background: #e6e3da; border-color: var(--line); }
  .swatch { width: 22px; height: 22px; min-width: 22px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  #note { flex: 1; min-width: 120px; height: 40px; resize: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; font: inherit; background: var(--paper); color: var(--ink); }
  #send { background: var(--accent); color: #fff; font-weight: 600; padding: 0 16px; height: 40px; }
  #send:hover { filter: brightness(1.05); background: var(--accent); }
  #status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #status i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
  #status.on i { background: var(--ok); }
  #toast { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 720px) { #status span { display: none; } .hide-sm { display: none; } }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="paper"></canvas>
  <div id="bubble"><b>Claude</b><span id="bubbleText"></span></div>
  <input id="textInput" type="text" spellcheck="false">
</div></div>

<div id="bar">
  <div class="group" role="group" aria-label="Tools">
    <button data-tool="pen" aria-pressed="true" title="Pen (P)">✎</button>
    <button data-tool="eraser" aria-pressed="false" title="Eraser (E)">⌫</button>
    <button data-tool="text" aria-pressed="false" title="Text (T)">T</button>
  </div>
  <div class="group hide-sm" role="group" aria-label="Colors">
    <button class="swatch" data-color="#1f2328" aria-pressed="true" style="background:#1f2328" title="Ink"></button>
    <button class="swatch" data-color="#2f6fde" aria-pressed="false" style="background:#2f6fde" title="Blue"></button>
    <button class="swatch" data-color="#d1453b" aria-pressed="false" style="background:#d1453b" title="Red"></button>
    <button class="swatch" data-color="#2e9e5b" aria-pressed="false" style="background:#2e9e5b" title="Green"></button>
  </div>
  <div class="sep hide-sm"></div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="clear" title="Clear canvas">Clear</button>
  </div>
  <textarea id="note" placeholder="A few words, if you want (optional)"></textarea>
  <div id="status"><i></i><span>Claude isn't listening</span></div>
  <button id="send" title="Send to Claude (Ctrl+Enter)">Send to Claude</button>
</div>
<div id="toast"></div>

<script>
const CLAUDE_COLOR = '#c96442';
const paper = document.getElementById('paper');
const ctx = paper.getContext('2d');
const $ = (id) => document.getElementById(id);

let canvasSize = { width: 1200, height: 800 };
let state = { version: 0, items: [], say: null, waiting: false };
let scale = 1;
let tool = 'pen';
let color = '#1f2328';
let drawing = null;          // stroke in progress
let pending = [];            // strokes posted but not yet echoed back: {item, version}
let erasing = null;          // Set of ids hidden locally during an eraser drag

// ---------------------------------------------------------------- layout

function fit() {
  const stage = $('stage').getBoundingClientRect();
  scale = Math.min((stage.width - 32) / canvasSize.width, (stage.height - 32) / canvasSize.height);
  const dpr = window.devicePixelRatio || 1;
  paper.style.width = `${canvasSize.width * scale}px`;
  paper.style.height = `${canvasSize.height * scale}px`;
  paper.width = Math.round(canvasSize.width * scale * dpr);
  paper.height = Math.round(canvasSize.height * scale * dpr);
  render();
}
window.addEventListener('resize', fit);

// ---------------------------------------------------------------- drawing

function rngFor(id) {
  let h = 2166136261;
  for (const ch of String(id)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {
    h = Math.imul(h ^ (h >>> 15), h | 1);
    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}

// A slightly wobbly line so Claude's shapes sit next to hand-drawn ones without looking out of place.
function roughLine(c, x1, y1, x2, y2, rnd) {
  const j = () => (rnd() - 0.5) * 2;
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const bend = Math.min(4, len * 0.02) * j();
  const mx = (x1 + x2) / 2 + (-(y2 - y1) / len) * bend;
  const my = (y1 + y2) / 2 + ((x2 - x1) / len) * bend;
  c.moveTo(x1 + j(), y1 + j());
  c.quadraticCurveTo(mx, my, x2 + j(), y2 + j());
}

function smoothPath(c, pts) {
  if (!pts.length) return;
  c.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 1) { c.lineTo(pts[0][0] + 0.1, pts[0][1] + 0.1); return; }
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    c.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const last = pts[pts.length - 1];
  c.lineTo(last[0], last[1]);
}

function wrapText(c, text, maxWidth) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(/(\s+)/)) {
      const test = line + word;
      if (line && c.measureText(test).width > maxWidth) { out.push(line.trim()); line = word.trimStart(); }
      else line = test;
    }
    out.push(line.trim());
  }
  return out;
}

function drawLabel(c, it, cx, cy, maxWidth) {
  if (!it.text) return;
  const size = it.size || 20;
  c.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
  c.fillStyle = it.textColor || it.color || (it.author === 'claude' ? CLAUDE_COLOR : '#1f2328');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const lines = wrapText(c, it.text, Math.max(20, maxWidth));
  const lh = size * 1.25;
  lines.forEach((ln, i) => c.fillText(ln, cx, cy + (i - (lines.length - 1) / 2) * lh));
}

function drawItem(c, it) {
  const stroke = it.color || (it.author === 'claude' ? CLAUDE_COLOR : '#1f2328');
  const rnd = rngFor(it.id || 'tmp');
  c.save();
  c.strokeStyle = stroke;
  c.lineWidth = it.width || (it.type === 'stroke' ? 3 : 2.5);
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.setLineDash(it.dashed ? [10, 8] : []);
  switch (it.type) {
    case 'stroke':
      c.beginPath(); smoothPath(c, it.points); c.stroke(); break;
    case 'line':
    case 'arrow': {
      const p = it.points;
      c.beginPath();
      for (let i = 0; i < p.length - 1; i++) roughLine(c, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1], rnd);
      c.stroke();
      if (it.type === 'arrow' && p.length > 1) {
        const [ax, ay] = p[p.length - 2], [bx, by] = p[p.length - 1];
        const ang = Math.atan2(by - ay, bx - ax), L = 14;
        c.setLineDash([]);
        c.beginPath();
        c.moveTo(bx - L * Math.cos(ang - 0.45), by - L * Math.sin(ang - 0.45));
        c.lineTo(bx, by);
        c.lineTo(bx - L * Math.cos(ang + 0.45), by - L * Math.sin(ang + 0.45));
        c.stroke();
      }
      if (it.text) {
        const mid = p[Math.floor((p.length - 1) / 2)], nxt = p[Math.min(p.length - 1, Math.floor((p.length - 1) / 2) + 1)];
        drawLabel(c, { ...it, size: it.size || 16 }, (mid[0] + nxt[0]) / 2, (mid[1] + nxt[1]) / 2 - 14, 200);
      }
      break;
    }
    case 'polygon': {
      const p = it.points;
      if (it.fill && p.length > 2) {
        c.beginPath();
        p.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
        c.closePath();
        c.fillStyle = it.fill; c.fill();
      }
      c.beginPath();
      for (let i = 0; i < p.length; i++) {
        const a = p[i], b = p[(i + 1) % p.length];
        roughLine(c, a[0], a[1], b[0], b[1], rnd);
      }
      c.stroke();
      if (it.text) {
        const cx = p.reduce((s, q) => s + q[0], 0) / p.length, cy = p.reduce((s, q) => s + q[1], 0) / p.length;
        const xs = p.map((q) => q[0]);
        drawLabel(c, it, cx, cy, (Math.max(...xs) - Math.min(...xs)) * 0.6);
      }
      break;
    }
    case 'rect': {
      const { x, y, w, h } = it;
      if (it.fill) { c.fillStyle = it.fill; c.fillRect(x, y, w, h); }
      c.beginPath();
      roughLine(c, x, y, x + w, y, rnd); roughLine(c, x + w, y, x + w, y + h, rnd);
      roughLine(c, x + w, y + h, x, y + h, rnd); roughLine(c, x, y + h, x, y, rnd);
      c.stroke();
      drawLabel(c, it, x + w / 2, y + h / 2, w - 16);
      break;
    }
    case 'ellipse': {
      const cx = it.x + it.w / 2, cy = it.y + it.h / 2, rx = Math.abs(it.w / 2), ry = Math.abs(it.h / 2);
      const phase = rnd() * Math.PI * 2;
      c.beginPath();
      for (let i = 0; i <= 48; i++) {
        const t = (i / 48) * (Math.PI * 2 + 0.25) + phase;
        const k = 1 + 0.015 * Math.sin(3 * t + phase);
        const px = cx + rx * k * Math.cos(t), py = cy + ry * k * Math.sin(t);
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      if (it.fill) { c.fillStyle = it.fill; c.fill(); }
      c.stroke();
      drawLabel(c, it, cx, cy, it.w * 0.75);
      break;
    }
    case 'text': {
      const size = it.size || 24;
      c.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
      c.fillStyle = stroke; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      String(it.text || '').split('\n').forEach((ln, i) => c.fillText(ln, it.x, it.y + i * size * 1.25));
      break;
    }
  }
  c.restore();
}

function visibleItems() {
  const hidden = erasing || new Set();
  return [...state.items.filter((it) => !hidden.has(it.id)), ...pending.map((p) => p.item)];
}

function paint(c, k) {
  c.setTransform(k, 0, 0, k, 0, 0);
  c.fillStyle = '#ffffff';
  c.fillRect(0, 0, canvasSize.width, canvasSize.height);
  for (const it of visibleItems()) drawItem(c, it);
  if (drawing) drawItem(c, drawing);
}

function render() { paint(ctx, scale * (window.devicePixelRatio || 1)); }

function snapshot() {
  const off = document.createElement('canvas');
  off.width = canvasSize.width; off.height = canvasSize.height;
  const saved = drawing; drawing = null;
  paint(off.getContext('2d'), 1);
  drawing = saved;
  return off.toDataURL('image/png');
}

let snapTimer = null;
function scheduleSnapshot() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    post('/api/snapshot', { png: snapshot(), version: state.version }).catch(() => {});
  }, 250);
}

// ---------------------------------------------------------------- server sync

async function post(route, body) {
  const res = await fetch(route, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  return res.json();
}

function applyState(next) {
  const changed = next.version !== state.version;
  state = next;
  if (next.canvas && (next.canvas.width !== canvasSize.width || next.canvas.height !== canvasSize.height)) {
    canvasSize = next.canvas; fit();
  }
  pending = pending.filter((p) => p.version === null || p.version > state.version);
  $('bubble').style.display = state.say ? 'block' : 'none';
  $('bubbleText').textContent = state.say || '';
  $('status').classList.toggle('on', state.waiting);
  $('status').querySelector('span').textContent = state.waiting ? 'Claude is listening' : "Claude isn't listening";
  render();
  if (changed) scheduleSnapshot();
}

const events = new EventSource('/api/events');
events.onmessage = (e) => applyState(JSON.parse(e.data));

async function addItems(items) {
  const entries = items.map((item) => ({ item, version: null }));
  pending.push(...entries);
  render();
  const r = await post('/api/ops', { author: 'user', add: items });
  entries.forEach((e) => { e.version = r.version; });
  pending = pending.filter((p) => p.version === null || p.version > state.version);
  render();
}

// ---------------------------------------------------------------- input

function toLogical(e) {
  const r = paper.getBoundingClientRect();
  return [Math.round(((e.clientX - r.left) / scale) * 10) / 10, Math.round(((e.clientY - r.top) / scale) * 10) / 10];
}

function distToSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

function hits(it, p) {
  const R = 10;
  if (it.type === 'polygon') {
    const xs = it.points.map((q) => q[0]), ys = it.points.map((q) => q[1]);
    return p[0] >= Math.min(...xs) - R && p[0] <= Math.max(...xs) + R && p[1] >= Math.min(...ys) - R && p[1] <= Math.max(...ys) + R;
  }
  if (it.points) {
    if (it.points.length === 1) return Math.hypot(p[0] - it.points[0][0], p[1] - it.points[0][1]) < R;
    for (let i = 0; i < it.points.length - 1; i++) if (distToSegment(p, it.points[i], it.points[i + 1]) < R) return true;
    return false;
  }
  if (it.type === 'text') {
    const size = it.size || 24;
    ctx.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
    const w = Math.max(...String(it.text).split('\n').map((l) => ctx.measureText(l).width));
    const lines = String(it.text).split('\n').length;
    return p[0] >= it.x - R && p[0] <= it.x + w + R && p[1] >= it.y - size - R && p[1] <= it.y + (lines - 1) * size * 1.25 + R;
  }
  const x1 = Math.min(it.x, it.x + it.w), x2 = Math.max(it.x, it.x + it.w);
  const y1 = Math.min(it.y, it.y + it.h), y2 = Math.max(it.y, it.y + it.h);
  return p[0] >= x1 - R && p[0] <= x2 + R && p[1] >= y1 - R && p[1] <= y2 + R;
}

function eraseAt(p) {
  for (const it of state.items) if (!erasing.has(it.id) && hits(it, p)) erasing.add(it.id);
  render();
}

paper.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const p = toLogical(e);
  if (tool === 'text') { openTextInput(p); e.preventDefault(); return; }
  paper.setPointerCapture(e.pointerId);
  if (tool === 'eraser') { erasing = new Set(); eraseAt(p); return; }
  drawing = { type: 'stroke', points: [p], color, author: 'user', id: 'live' };
  render();
});

paper.addEventListener('pointermove', (e) => {
  if (tool === 'eraser' && erasing) { eraseAt(toLogical(e)); return; }
  if (!drawing) return;
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of events) {
    const p = toLogical(ev), last = drawing.points[drawing.points.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) >= 1.5) drawing.points.push(p);
  }
  render();
});

async function endPointer() {
  if (erasing) {
    const ids = [...erasing];
    if (ids.length) await post('/api/ops', { author: 'user', remove: ids });
    erasing = null;
    render();
    return;
  }
  if (!drawing) return;
  const { points, color: c } = drawing;
  drawing = null;
  await addItems([{ type: 'stroke', points, color: c }]);
}
paper.addEventListener('pointerup', endPointer);
paper.addEventListener('pointercancel', endPointer);

const textInput = $('textInput');
let textAt = null;
function openTextInput(p) {
  textAt = p;
  textInput.value = '';
  textInput.style.left = `${p[0] * scale}px`;
  textInput.style.top = `${p[1] * scale - 24 * scale}px`;
  textInput.style.fontSize = `${24 * scale}px`;
  textInput.style.color = color;
  textInput.style.display = 'block';
  setTimeout(() => textInput.focus(), 0);
}
function commitText() {
  const text = textInput.value.trim();
  textInput.style.display = 'none';
  if (text && textAt) addItems([{ type: 'text', x: textAt[0], y: textAt[1], text, color, size: 24 }]);
  textAt = null;
}
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commitText(); }
  if (e.key === 'Escape') { textAt = null; textInput.style.display = 'none'; }
});
textInput.addEventListener('blur', commitText);

function setTool(t) {
  tool = t;
  document.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  paper.className = t === 'pen' ? '' : t;
}
document.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', () => {
  color = b.dataset.color;
  document.querySelectorAll('[data-color]').forEach((s) => s.setAttribute('aria-pressed', String(s === b)));
  if (tool === 'eraser') setTool('pen');
}));

$('undo').addEventListener('click', () => post('/api/undo'));
$('clear').addEventListener('click', () => {
  if (state.items.length && confirm('Clear the whole canvas, including Claude\'s drawings?')) post('/api/ops', { author: 'user', clear: 'all', say: null });
});

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function send() {
  const note = $('note').value;
  const r = await post('/api/send', { png: snapshot(), note });
  $('note').value = '';
  toast(r.delivered ? 'Sent to Claude' : 'Saved. Claude will see it next time it listens');
}
$('send').addEventListener('click', send);
$('note').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

document.addEventListener('keydown', (e) => {
  if (e.target === textInput || e.target === $('note')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); post('/api/undo'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'p') setTool('pen');
  if (e.key === 'e') setTool('eraser');
  if (e.key === 't') setTool('text');
});

fit();
</script>
</body>
</html>
